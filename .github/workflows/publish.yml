name: Publish to npm

# Triggered by pushing a version tag, e.g.:
#   git tag v0.2.0 && git push origin v0.2.0
#
# Requires an NPM_TOKEN secret (Settings -> Secrets and variables -> Actions)
# holding an npm automation token with publish rights for the "visiomcp" package.

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # --ignore-scripts: skip compiling the winax native addon here (see
      # ci.yml for why). Publishing only needs dist/ built and doesn't
      # require winax to actually load; end users' own installs are
      # unaffected.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

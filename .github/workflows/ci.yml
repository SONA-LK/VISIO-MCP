name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # --ignore-scripts: skip compiling the winax native addon here.
      # node-gyp can't reliably detect the VS toolchain on hosted runners
      # (observed failing against windows-latest's bundled VS install), and
      # unit tests never load winax anyway (only the Windows+Visio
      # integration tests do, which aren't run in CI). Real installs by end
      # users are unaffected -- npm always runs install scripts normally
      # outside of an explicit --ignore-scripts flag.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit
